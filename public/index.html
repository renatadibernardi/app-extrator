<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=/app-extrator/doc-md">
    <title>App Extrator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f2ef;
        --panel: #ffffff;
        --line: #d8dfd1;
        --text: #1c2519;
        --muted: #687161;
        --brand: #1f5a2e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(460px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 22px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
      }

      p {
        margin: 10px 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        padding: 10px 14px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>App Extrator</h1>
      <p>Redirecionando para o Extrator Inteligente.</p>
      <a href="/app-extrator/doc-md">Abrir extrator</a>
    </main>
  </body>
</html>
